---
layout: default
---

{% for post in paginator.posts %}
  <div class="post-preview">
    <h2>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>
    <p>{{ post.content | truncatewords: 50 }}...</p>
  </div>
{% endfor %}

{% if paginator.total_pages > 1 %}
  {% include pagination.html %}
{% endif %}
