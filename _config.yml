name: Leviathianic
title: Leviathianic
url: http://leviathianic.com
author: Fernando

# Minimal Mistakes overrides
remote_theme: "mmistakes/minimal-mistakes@4.28.0"
_engine: jekyll/minimal-mistakes-jekyll
minimal_mistakes_skin: "aqua"

# Build Settings
markdown: kramdown
paginate: 5

plugins:
  - jekyll-include-cache
  
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "single"

